# Indicates whether this plugin is enabled.
is_enabled: true
debug: false
# The hint that is shown when someone pickups a custom item.
picked_up_hint:
# The broadcast content
  content: "\n\n\n\n\n\n<voffset=-60><size=60%>podniesiono</size></voffset>\n<size=70%>{0}</size>\n<size=60%>{1}</size>"
  # The broadcast duration
  duration: 6
  # The broadcast type
  type: Normal
  # Indicates whether the broadcast should be shown
  show: true
# The hint that is shown when someone selects a custom item.
selected_hint:
# The broadcast content
  content: "\n\n\n\n\n\n\n<size=70%>{0}</size>\n<size=60%>{1}</size>"
  # The broadcast duration
  duration: 4
  # The broadcast type
  type: Normal
  # Indicates whether the broadcast should be shown
  show: true
